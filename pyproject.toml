[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "permm"
version = "1.1.0"
description = "Python Environment for Reaction Mechanisms/Mathematics — dynamic analysis tools for evaluating chemical networks."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Barron Henderson", email = "barronh@gmail.com" }]
maintainers = [{ name = "Barron Henderson", email = "barronh@gmail.com" }]
dependencies = [
    "numpy>=1.21",
    "PyYAML>=5",
    "netCDF4>=1.5",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
# PseudoNetCDF pins numpy<2, which conflicts with newer stacks (e.g. musica).
# It's only needed for merged IRR/IPR (CMAQ) files and its file readers; the
# common path reads variables from any object with a `.variables` mapping
# (e.g. a netCDF4.Dataset), so keep it optional.
pseudonetcdf = ["PseudoNetCDF>=3.1"]
gui = ["wxPython"]

[project.urls]
Homepage = "https://github.com/barronh/permm"

[project.scripts]
permm = "permm.main:parse_and_run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
permm = [
    "mechanisms/*.yaml",
    "models/camx/*.yaml",
    "rules.yaml",
    "testdata/*",
]
